apiVersion: 1

datasources:
  - name: KBR Prometheus (Provisioned)
    uid: kbr-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST

  - name: KBR Elasticsearch Logs (Provisioned)
    uid: kbr-elasticsearch-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "kbr-docker-*"
    isDefault: false
    editable: false
    jsonData:
      index: "kbr-docker-*"
      timeField: "@timestamp"
      esVersion: "8.0.0"
      logMessageField: log
      logLevelField: log.level
