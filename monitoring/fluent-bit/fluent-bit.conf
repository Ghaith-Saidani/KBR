[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    storage.path    /var/fluent-bit/state/

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          source_file
    Tag               docker.*
    Tag_Regex         /var/lib/docker/containers/(?<container_id>[0-9a-f]+)/(?<file_name>[0-9a-f]+)-json.log
    Parser            docker
    DB                /var/fluent-bit/state/docker.db
    Read_from_Head    Off
    Refresh_Interval  5
    Rotate_Wait       30
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB

[FILTER]
    Name          modify
    Match         docker.*
    Add           application kbr

[FILTER]
    Name          lua
    Match         docker.*
    script        /fluent-bit/etc/docker_metadata.lua
    call          enrich_docker_log

[OUTPUT]
    Name                es
    Match               docker.*
    Host                elasticsearch
    Port                9200
    Index               kbr-docker-logs
    Logstash_Format     On
    Logstash_Prefix     kbr-docker
    Suppress_Type_Name  On
    Retry_Limit         False